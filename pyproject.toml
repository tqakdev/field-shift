[project]
name = "field-shift"
version = "0.2.0"
description = "Field Shift — NASA Space Apps 2026 (Streamlit + fieldshift package)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["fieldshift", "ui", "views", "scripts", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
